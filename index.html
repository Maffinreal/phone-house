<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Дом-телефон 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:5}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:10}
  #menu .box{background:#fff;border-radius:18px;padding:20px;width:min(280px,85vw);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  #menu h3{margin:0 0 14px;font-size:18px;color:#222}
  #menu a,#menu button{display:block;box-sizing:border-box;width:100%;margin:8px 0;padding:12px;border:0;border-radius:12px;font-size:16px;color:#fff;text-decoration:none;text-align:center;cursor:pointer}
  #menu .call{background:#34c759}
  #menu .wa{background:#25d366}
  #menu .tg{background:#229ed9}
  #menu .close{background:#e5e5e5;color:#333}
  #err{position:fixed;left:8px;right:8px;top:8px;background:#b00020;color:#fff;padding:10px;border-radius:10px;font-size:13px;display:none;z-index:20;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<div id="hint">Крути пальцем · щипок или колесо — приблизить · нажми на человечка</div>
<div id="err"></div>

<div id="menu">
  <div class="box">
    <h3 id="mTitle"></h3>
    <a class="call" id="bCall">Позвонить</a>
    <a class="wa" id="bWa" target="_blank" rel="noopener">WhatsApp</a>
    <a class="tg" id="bTg" target="_blank" rel="noopener">Telegram</a>
    <button class="close" id="bClose">Закрыть</button>
  </div>
</div>

<script>
  // Показываем ошибки прямо на экране, если что-то пошло не так
  window.addEventListener('error', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'Ошибка: ' + (e.message || e.error);
  });
  window.addEventListener('unhandledrejection', e => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'Ошибка загрузки: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
</script>

// ====== Константы дома ======
const W = 3.2, D = 2.4, FH = 3.2, T = 0.12, FLOORS = 3, H = FH * FLOORS;

// ====== Сцена, камера, рендер ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ff);
scene.fog = new THREE.Fog(0xbfe3ff, 60, 130);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x5b7f35, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(14, 25, 12);
scene.add(sun);

// ====== Участок с травой ======
function grassTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#5fae4a';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) {
    g.fillStyle = `hsl(${95 + Math.random() * 25},${45 + Math.random() * 25}%,${28 + Math.random() * 25}%)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 3 + Math.random() * 4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30, 30);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.MeshStandardMaterial({ map: grassTexture() })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// дорожка к дому
const pathMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 0.02, 7),
  new THREE.MeshStandardMaterial({ color: 0xd8c8a0 })
);
pathMesh.position.set(0, 0.02, D / 2 + 3.5);
scene.add(pathMesh);

// ====== Деревья и кусты ======
function makeTree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18 * s, 0.25 * s, 1.8 * s, 8),
    new THREE.MeshStandardMaterial({ color: 0x7a5230 })
  );
  trunk.position.y = 0.9 * s;
  g.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.3 * s, 1),
    new THREE.MeshStandardMaterial({ color: 0x2e8b3a, flatShading: true })
  );
  leaves.position.y = 2.6 * s;
  g.add(leaves);
  g.position.set(x, 0, z);
  scene.add(g);
}
function makeBush(x, z, s) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.6 * s, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0x3f9a45, flatShading: true })
  );
  m.position.set(x, 0.4 * s, z);
  m.scale.y = 0.8;
  scene.add(m);
}
function freeSpot() {
  let x, z;
  do {
    x = (Math.random() - 0.5) * 46;
    z = (Math.random() - 0.5) * 46;
  } while (
    (Math.abs(x) < 3.4 && Math.abs(z) < 3.4) ||
    (Math.abs(x) < 1.6 && z > 0)
  );
  return [x, z];
}
for (let i = 0; i < 16; i++) {
  const [x, z] = freeSpot();
  makeTree(x, z, 0.8 + Math.random() * 0.6);
}
for (let i = 0; i < 34; i++) {
  const [x, z] = freeSpot();
  makeBush(x, z, 0.5 + Math.random() * 0.5);
}

scene.add(house);
